services:
  postgres:
    image: postgres:16-alpine
    container_name: jennys_white_haven_v2_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - ./db/data:/var/lib/postgresql/data
