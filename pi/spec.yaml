schemaVersion: '1'
kind: agent
name: pi
agent:
  image: 'docker/sandbox-templates:shell-docker'
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  allowedDomains:
    - 'pi.dev:443'
    - 'localhost:1234'

environment:
  variables:
    IS_SANDBOX: '1'
    PI_CODING_AGENT_DIR: '~'

commands:
  install:
    - command: 'npm install -g --ignore-scripts @earendil-works/pi-coding-agent'
      user: '1000'
      description: Install Pi
